<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2f6f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TODO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<style>
  :root {
    --bg: #f6f6f4; --fg: #1a1a1a; --muted: #8a8a86;
    --card: #ffffff; --line: #e4e4e0; --accent: #2f6f4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131315; --fg: #e8e8e6; --muted: #7c7c80;
      --card: #1d1d20; --line: #2a2a2e; --accent: #6fbf94;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  #app { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #tabs {
    display: flex; gap: 8px; padding: 14px 14px 10px; overflow-x: auto;
    flex: none;
  }
  #tabs button {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 15px;
    white-space: nowrap;
  }
  #tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #list { flex: 1; overflow-y: auto; padding: 4px 14px 14px; }
  .item {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 14px; margin-bottom: 8px;
  }
  .item.out { opacity: 0.25; }
  .item.editing { border-color: var(--accent); }
  .item.today { border-color: var(--accent); }
  .item.today .txt { font-weight: 600; }
  .star {
    flex: none; margin-left: auto; background: none; border: 0; padding: 0 2px;
    font-size: 22px; line-height: 1; color: var(--line);
  }
  .item.today .star { color: var(--accent); }
  .tick {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--muted); background: none; padding: 0;
  }
  .txt { overflow-wrap: anywhere; }
  #empty, #err { color: var(--muted); text-align: center; padding: 24px 0; }
  #err { color: #c0564f; }
  #bar {
    flex: none; display: flex; gap: 8px; padding: 10px 14px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--card);
  }
  #new {
    flex: 1; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  #bar button, #tokform button {
    font: inherit; border: 0; border-radius: 10px; padding: 10px 16px;
    background: var(--accent); color: #fff;
  }
  #cancel { background: var(--line) !important; color: var(--muted) !important; }
  #tokform { padding: 40px 20px; display: flex; flex-direction: column; gap: 10px; }
  #tokform input {
    font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
</style>
</head>
<body>

<div id="app" hidden>
  <div id="tabs"></div>
  <div id="list"></div>
  <form id="bar">
    <input id="new" placeholder="Add a todo…" autocomplete="off">
    <button id="cancel" type="button" hidden>✕</button>
    <button id="go">Add</button>
  </form>
</div>
<form id="tokform" hidden>
  <div>Enter the todo token</div>
  <input id="tok" autocomplete="off">
  <button>Save</button>
</form>

<script>
  // The Apps Script web app doing the sheet reads/writes. The URL is public
  // knowledge; the token (entered once, kept in localStorage) is the secret.
  var API = "https://script.google.com/macros/s/AKfycbwzJUdYPXPQaN4yeseF6w07p1tmRIrEBe1ipIoFmqCaDsATLD3qh6hrEbL-lGexsHoAoQ/exec";

  // Apps Script takes seconds per call, so the page never waits on it:
  // the last known list + tab are painted from localStorage on open, and
  // writes go through an outbox that is replayed on the next open if the
  // app got closed before Google answered.
  var store = {
    get: function (k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var token = null, tabs = store.get("todo-cache", {}), current = store.get("todo-tab", null);
  var outbox = store.get("todo-outbox", []), sending = false;
  var editing = null;  // item currently loaded into the input, or null

  try {
    var fromUrl = new URLSearchParams(location.search).get("key");
    if (fromUrl) {
      localStorage.setItem("todo-token", fromUrl);
      history.replaceState(null, "", location.pathname);
    }
    token = localStorage.getItem("todo-token");
  } catch (e) {}

  var app = document.getElementById("app"),
      tokform = document.getElementById("tokform"),
      tabsEl = document.getElementById("tabs"),
      listEl = document.getElementById("list"),
      newEl = document.getElementById("new"),
      goEl = document.getElementById("go"),
      cancelEl = document.getElementById("cancel");

  function list() {
    return fetch(API + "?token=" + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
        return res.tabs;
      });
  }

  function write(params) {
    var body = new URLSearchParams(params);
    body.set("token", token);
    return fetch(API, { method: "POST", body: body, keepalive: true })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
      });
  }

  // Queue a write and start draining. Each op is retried until it succeeds or
  // the server rejects it for a reason other than being unreachable.
  function enqueue(op) {
    outbox.push(op);
    store.set("todo-outbox", outbox);
    drain();
  }

  function drain() {
    if (sending || !outbox.length || !token) return;
    sending = true;
    var op = outbox[0];
    write(op).then(function () {
      outbox.shift();
    }).catch(function (err) {
      var msg = String(err.message || err);
      if (msg.indexOf("bad token") >= 0) return fail(err);
      // "not found" etc: the server saw it and said no, drop it; network
      // errors keep it for the next attempt
      if (err instanceof TypeError) return;
      outbox.shift();
      showErr(msg);
    }).then(function () {
      store.set("todo-outbox", outbox);
      sending = false;
      if (outbox.length) setTimeout(drain, 3000);
    });
  }

  // Fresh data from the server is missing whatever is still in the outbox.
  function applyOutbox(fresh) {
    outbox.forEach(function (op) {
      var items = fresh[op.tab];
      if (!items) return;
      if (op.action === "add") items.push([null, op.text]);
      var i = items.findIndex(function (x) { return x[1] === op.text; });
      if (op.action === "done" && i >= 0) items.splice(i, 1);
      if (op.action === "edit" && i >= 0) items[i][1] = op.new_text;
      if (op.action === "today" && i >= 0) items[i][2] = op.value === "1";
    });
    return fresh;
  }

  function showErr(msg) {
    listEl.insertAdjacentHTML("afterbegin", '<div id="err">' + msg + "</div>");
  }

  function fail(err) {
    if (String(err.message || err).indexOf("bad token") >= 0) {
      try { localStorage.removeItem("todo-token"); } catch (e) {}
      token = null; boot(); return;
    }
    showErr(String(err.message || err));
  }

  function refresh() {
    list().then(function (fresh) {
      fresh = applyOutbox(fresh);
      if (JSON.stringify(fresh) !== JSON.stringify(tabs)) render(fresh);
      drain();
    }).catch(fail);
  }

  function render(fresh) {
    if (fresh) tabs = fresh;
    store.set("todo-cache", tabs);
    var names = Object.keys(tabs);
    if (current === null || names.indexOf(current) < 0) current = names[0] || null;
    store.set("todo-tab", current);
    tabsEl.innerHTML = "";
    names.forEach(function (n) {
      var b = document.createElement("button");
      b.textContent = n;
      b.className = n === current ? "on" : "";
      b.onclick = function () { current = n; stopEdit(); render(); };
      tabsEl.appendChild(b);
    });
    listEl.innerHTML = "";
    // today-flagged items float to the top
    var items = (tabs[current] || []).slice().sort(function (a, b) { return (b[2] ? 1 : 0) - (a[2] ? 1 : 0); });
    if (!items.length) listEl.innerHTML = '<div id="empty">nothing here 🎉</div>';
    items.forEach(function (it) {
      var text = it[1];
      var row = document.createElement("div");
      row.className = "item" + (it === editing ? " editing" : "") + (it[2] ? " today" : "");
      var tick = document.createElement("button");
      tick.className = "tick";
      tick.onclick = function () {
        row.classList.add("out");
        tabs[current] = tabs[current].filter(function (x) { return x !== it; });
        setTimeout(render, 150);
        enqueue({ action: "done", tab: current, text: text });
      };
      var span = document.createElement("span");
      span.className = "txt";
      span.textContent = text;
      span.onclick = function () { startEdit(it); };
      var star = document.createElement("button");
      star.className = "star";
      star.textContent = it[2] ? "★" : "☆";
      star.onclick = function () {
        it[2] = !it[2];
        render();
        enqueue({ action: "today", tab: current, text: it[1], value: it[2] ? "1" : "0" });
      };
      row.appendChild(tick); row.appendChild(span); row.appendChild(star);
      listEl.appendChild(row);
    });
  }

  function startEdit(it) {
    editing = it;
    newEl.value = it[1];
    goEl.textContent = "Save";
    cancelEl.hidden = false;
    render();
    newEl.focus();
  }

  function stopEdit() {
    if (!editing) return;
    editing = null;
    newEl.value = "";
    goEl.textContent = "Add";
    cancelEl.hidden = true;
  }

  cancelEl.onclick = function () { stopEdit(); render(); };

  document.getElementById("bar").onsubmit = function (ev) {
    ev.preventDefault();
    var text = newEl.value.trim();
    if (!text || !current) return;
    if (editing) {
      var it = editing, old = it[1];
      stopEdit();
      if (text !== old) {
        it[1] = text;
        enqueue({ action: "edit", tab: current, text: old, new_text: text });
      }
      render();
      return;
    }
    newEl.value = "";
    tabs[current] = (tabs[current] || []).concat([[null, text, false]]);
    render();
    enqueue({ action: "add", tab: current, text: text });
  };

  tokform.onsubmit = function (ev) {
    ev.preventDefault();
    var t = document.getElementById("tok").value.trim();
    if (!t) return;
    try { localStorage.setItem("todo-token", t); } catch (e) {}
    token = t; boot();
  };

  function boot() {
    tokform.hidden = !!token;
    app.hidden = !token;
    if (!token) return;
    if (Object.keys(tabs).length) { render(); newEl.focus(); }
    else listEl.innerHTML = '<div id="empty">loading…</div>';
    drain();
    refresh();
  }
  boot();

  // refresh when the app is brought back to the foreground
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && token) { drain(); refresh(); }
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#f3f4f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TODO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<style>
  :root {
    --bg: #f3f4f1; --fg: #191b1e; --muted: #7d8288; --faint: #b9bdc2;
    --line: #dfe2de; --accent: #2b6e58; --sel: #e6ebe4; --star: #d69a1e;
    --err: #b5433b;
    --size: 15px; --lh: 1.45; --pad: 10px; --tick: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --fg: #e6e6e3; --muted: #85898f; --faint: #4b4f55;
      --line: #2a2c30; --accent: #6fbf97; --sel: #23262a; --star: #e2ad3a;
    }
  }
  /* touch screens: roomier */
  @media (pointer: coarse) { :root { --size: 17px; --pad: 14px; --tick: 22px; } }

  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: var(--size)/var(--lh) -apple-system, system-ui, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #app { display: flex; flex-direction: column; flex: 1; min-height: 0; position: relative; }

  /* tabs: a row of words, the current one underlined */
  #tabs {
    display: flex; gap: 2px; padding: 10px var(--pad) 0; overflow-x: auto; flex: none;
    border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button {
    padding: 6px 8px 8px; color: var(--muted); white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px; letter-spacing: 0.01em;
  }
  #tabs button.on { color: var(--fg); border-bottom-color: var(--fg); }

  /* list */
  #list { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
  .item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: calc(var(--pad) * 0.7) var(--pad) calc(var(--pad) * 0.7) calc(var(--pad) - 3px);
    border-left: 3px solid transparent; border-bottom: 1px solid var(--line);
    cursor: text; -webkit-user-select: none; user-select: none;
  }
  .item:last-child { border-bottom: 0; }
  .item.sel { background: var(--sel); border-left-color: var(--accent); }
  .item.out { opacity: 0; transform: translateX(8px); transition: opacity .15s, transform .15s; }
  .item.editing { background: var(--sel); }
  .item.today .txt { font-weight: 600; }

  /* The controls in a row are sized off the text's line height so they sit
     centred on the first line, however many lines the item wraps to. The
     ::before block on each is an invisible, larger tap target. */
  .tick, .star, .bub { position: relative; }
  .tick::before, .star::before { content: ""; position: absolute; inset: -9px; }
  .bub::before { content: ""; position: absolute; inset: -7px -2px; }

  .tick {
    flex: none; font-size: var(--tick); width: 1em; height: 1em; border-radius: 50%;
    margin-top: calc((var(--size) * var(--lh) - var(--tick)) / 2);
    border: 1.5px solid var(--faint); display: grid; place-items: center;
    transition: background .12s, border-color .12s;
  }
  .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .txt:focus { outline: none; }
  .item.editing .txt { caret-color: var(--accent); -webkit-user-select: text; user-select: text; }

  .star {
    flex: none; width: 22px; height: 22px; line-height: 22px;
    margin-top: calc((var(--size) * var(--lh) - 22px) / 2);
    text-align: center; font-size: 17px; color: var(--faint);
    opacity: 0; transition: opacity .12s, color .12s;
  }
  .item.sel .star, .item.editing .star, .item.today .star { opacity: 1; }
  .item.today .star { color: var(--star); }
  @media (pointer: coarse) { .star { opacity: 1; } }

  /* who: hard-coded C / D bubbles, only on the list that uses them */
  .who { flex: none; display: flex; gap: 4px; margin-top: calc((var(--size) * var(--lh) - 21px) / 2); }
  .bub {
    width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--faint);
    font-size: 11px; line-height: 18px; text-align: center;
    color: var(--muted); font-weight: 600;
  }
  .bub.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  @media (pointer: coarse) {
    .who { margin-top: calc((var(--size) * var(--lh) - 26px) / 2); }
    .bub { width: 26px; height: 26px; line-height: 23px; font-size: 12px; }
  }

  /* Hover effects only where a pointer can hover: on a touch screen they
     would stick to whatever was tapped last. */
  @media (hover: hover) {
    #tabs button:hover { color: var(--fg); }
    .item:hover .star { opacity: 1; }
    .star:hover { color: var(--star); }
    .bub:hover { border-color: var(--accent); color: var(--accent); }
    .item:not(.done) .tick:hover { border-color: var(--accent); }
    .item:not(.done) .tick:hover::after {
      content: ""; width: .6em; height: .6em; border-radius: 50%; background: var(--accent);
    }
    #donehdr:hover { color: var(--fg); }
    #plus:hover { color: var(--accent); }
  }

  /* completed items, below the open ones */
  .item.done .txt { text-decoration: line-through; color: var(--muted); }
  .item.done .tick { border-color: var(--accent); background: var(--accent); }
  .item.done .tick::after {
    content: ""; width: .26em; height: .52em;
    border: solid var(--bg); border-width: 0 .11em .11em 0;
    transform: translateY(-.07em) rotate(45deg);
  }
  #donehdr {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
    padding: 14px var(--pad) 6px; color: var(--muted);
    font-size: 0.82em; letter-spacing: 0.06em; text-transform: uppercase;
  }
  #donehdr .chev { display: inline-block; transition: transform .15s; font-size: 1.1em; }
  #donehdr.closed .chev { transform: rotate(-90deg); }

  /* thin divider between today items and the rest */
  .divider { border-top: 1px dashed var(--faint); margin: 6px var(--pad); }

  #empty, #err { padding: 28px var(--pad); color: var(--muted); text-align: center; }
  #err { color: var(--err); padding: 10px var(--pad); text-align: left; border-bottom: 1px solid var(--line); }

  /* add box: a single line at the bottom */
  #bar {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 6px var(--pad) 6px calc(var(--pad) - 4px);
    padding-bottom: calc(6px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  #plus {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; color: var(--faint);
    transition: color .12s;
  }
  #plus svg { width: 18px; height: 18px; display: block; }
  #bar:focus-within #plus { color: var(--accent); }
  #new { flex: 1; font: inherit; color: var(--fg); background: none; border: 0; padding: 8px 0; min-width: 0; }
  #new::placeholder { color: var(--faint); }
  #new:focus { outline: none; }

  /* keyboard help, toggled with ? */
  #help {
    position: absolute; left: var(--pad); right: var(--pad); bottom: 52px;
    background: var(--bg); border: 1px solid var(--line); padding: 12px 14px;
    display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 0.93em;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  }
  #help kbd { font: inherit; color: var(--muted); text-align: right; }

  /* sign-in */
  #login { padding: 40px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
  #login input {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line); background: none; color: var(--fg);
  }
  #login button { padding: 10px 16px; background: var(--accent); color: #fff; }
  #login .msg { color: var(--err); min-height: 1.4em; }
</style>
</head>
<body>

<div id="app" hidden>
  <div id="tabs"></div>
  <div id="list"></div>
  <form id="bar">
    <button type="submit" id="plus" aria-label="Add" title="Add">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M10 4v12M4 10h12"/>
      </svg>
    </button>
    <input id="new" placeholder="Add a todo" autocomplete="off" enterkeyhint="done">
  </form>
  <div id="help" hidden>
    <kbd>j k ↑ ↓</kbd><span>move</span>
    <kbd>h l tab 1–9</kbd><span>switch list</span>
    <kbd>a</kbd><span>add</span>
    <kbd>e ↵</kbd><span>edit</span>
    <kbd>t</kbd><span>flag for today</span>
    <kbd>d</kbd><span>done / undone</span>
    <kbd>C D</kbd><span>assign (MOVE list)</span>
    <kbd>U</kbd><span>unassign</span>
    <kbd>r</kbd><span>refresh</span>
    <kbd>o</kbd><span>open the table</span>
    <kbd>esc</kbd><span>leave the add box, clear selection</span>
    <kbd>?</kbd><span>this</span>
  </div>
</div>
<form id="login" hidden>
  <div>Sign in to your todos</div>
  <input id="email" type="email" placeholder="email" autocomplete="username">
  <input id="password" type="password" placeholder="password" autocomplete="current-password">
  <button>Sign in</button>
  <div class="msg" id="loginmsg"></div>
</form>

<script>
  // Supabase project. URL and anon key are public by design; row level
  // security only lets the signed-in user at the rows. The session (a
  // refresh token) is kept in localStorage after signing in once.
  var SUPABASE = "https://wpfstejpyuetuqmayipa.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwZnN0ZWpweXVldHVxbWF5aXBhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDY2NjUsImV4cCI6MjEwNDAyMjY2NX0.YfBOezAawCQUL3uT2taZ4hoLeYFCw0PgyEouav3YEDI";
  var TABLE_URL = "https://supabase.com/dashboard/project/wpfstejpyuetuqmayipa/editor";

  var store = {
    get: function (k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // The one list that tracks who does what, with C / D bubbles per row.
  var ASSIGNEE_LIST = "MOVE";

  // tabs: {list name: [{id, text, today, assignee, done_at}, ...]} — from cache on open
  var tabs = store.get("todo-cache", {}), current = store.get("todo-tab", null);
  var doneOpen = store.get("todo-done-open", true);
  var session = store.get("todo-session", null);
  var editing = null;   // {it, end} while an item is edited in place, else null
  var sel = null;       // the item keys act on: the last one clicked or moved to
  var keyNav = false;   // the selection is only painted once the keyboard is in use
  var shown = [];       // items of the current tab in display order (open, then completed)
  var rows = {};        // item -> its row element, for the current paint

  var app = document.getElementById("app"),
      login = document.getElementById("login"),
      tabsEl = document.getElementById("tabs"),
      listEl = document.getElementById("list"),
      newEl = document.getElementById("new"),
      helpEl = document.getElementById("help");

  // ---- auth

  function auth(grant, body) {
    return fetch(SUPABASE + "/auth/v1/token?grant_type=" + grant, {
      method: "POST", headers: { apikey: ANON, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error_description || res.j.msg || res.j.message || "sign-in failed");
        session = { access: res.j.access_token, refresh: res.j.refresh_token,
                    exp: Date.now() + (res.j.expires_in || 3600) * 1000 };
        store.set("todo-session", session);
        return session.access;
      });
  }

  var refreshing = null;
  function token(force) {
    if (!session) return Promise.reject(new Error("signed out"));
    if (!force && session.exp - Date.now() > 60000) return Promise.resolve(session.access);
    if (!refreshing) {
      refreshing = auth("refresh_token", { refresh_token: session.refresh })
        .catch(function (err) { signOut(); throw err; })
        .then(function (t) { refreshing = null; return t; }, function (err) { refreshing = null; throw err; });
    }
    return refreshing;
  }

  function signOut() {
    session = null; store.del("todo-session"); boot();
  }

  // ---- rest

  function rest(path, opts, retry) {
    opts = opts || {};
    return token(retry).then(function (t) {
      var headers = { apikey: ANON, Authorization: "Bearer " + t };
      if (opts.body) headers["Content-Type"] = "application/json";
      if (opts.prefer) headers.Prefer = opts.prefer;
      return fetch(SUPABASE + "/rest/v1/" + path, {
        method: opts.method || "GET", headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined, keepalive: true
      });
    }).then(function (r) {
      if (r.status === 401 && !retry) return rest(path, opts, true);
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) {
        throw new Error(j.message || j.hint || ("error " + r.status));
      });
      return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  function patch(it, fields) {
    return byId(it).then(function (id) {
      return rest("todos?id=eq." + id, { method: "PATCH", body: fields, prefer: "return=minimal" });
    });
  }

  function list() {
    return Promise.all([
      rest("lists?select=name&order=position,name"),
      rest("todos?select=id,list,text,today,assignee,done_at&order=position,created_at")
    ]).then(function (res) {
      var fresh = {};
      res[0].forEach(function (l) { fresh[l.name] = []; });
      res[1].forEach(function (r) {
        (fresh[r.list] = fresh[r.list] || []).push({
          id: r.id, text: r.text, today: r.today, assignee: r.assignee, done_at: r.done_at });
      });
      return fresh;
    });
  }

  // Writes: optimistic in the UI, then the request, then a refresh to settle.
  // While a write is in flight no fetched state is painted: it would predate
  // the write and briefly undo it on screen.
  var writes = 0;
  function write(p) {
    writes++;
    return p.then(function () { writes--; refresh(); },
                  function (err) { writes--; showErr(String(err.message || err)); refresh(); });
  }

  function showErr(msg) {
    var old = document.getElementById("err");
    if (old) old.remove();
    var el = document.createElement("div");
    el.id = "err"; el.textContent = msg;
    listEl.insertAdjacentElement("afterbegin", el);
  }

  var fetching = false, again = false;
  function refresh() {
    if (!session) return;
    if (fetching) { again = true; return; }  // one more pass once this fetch lands
    fetching = true;
    return list().then(function (fresh) {
      fetching = false;
      if (again) { again = false; return refresh(); }
      if (writes) return;
      render(fresh);
    }).catch(function (err) {
      fetching = false; again = false;
      if (session) showErr(String(err.message || err));
    });
  }

  // ---- render

  // The same item in a fresh paint: by id, or by text while it has none yet.
  function keepSelection(items, it) {
    if (it === undefined) it = sel;
    if (!it) return null;
    return items.find(function (x) { return x.id === it.id || (!x.id && x.text === it.text); }) || null;
  }

  // Nothing is repainted under an open edit: the row being typed in would
  // lose focus, and a tap on another row would land on a moved element.
  // The paint runs once the edit ends.
  var dirty = false, pendingFresh = null;

  function render(fresh) {
    if (editing) { dirty = true; if (fresh) pendingFresh = fresh; return; }
    if (fresh) tabs = fresh;
    store.set("todo-cache", tabs);
    var names = Object.keys(tabs);
    if (current === null || names.indexOf(current) < 0) current = names[0] || null;
    store.set("todo-tab", current);

    tabsEl.innerHTML = "";
    names.forEach(function (n) {
      var b = document.createElement("button");
      b.textContent = n;
      b.className = n === current ? "on" : "";
      b.onclick = function () { switchTab(n); };
      tabsEl.appendChild(b);
    });

    listEl.innerHTML = "";
    rows = {};
    var all = tabs[current] || [];
    var open = all.filter(function (x) { return !x.done_at; });
    // today items stay on top in their stored order; the rest is alphabetical
    var items = open.filter(function (x) { return x.today; }).concat(
      open.filter(function (x) { return !x.today; }).sort(function (a, b) {
        return a.text.localeCompare(b.text, "de", { sensitivity: "base" });
      }));
    // completed below, most recently ticked first
    var done = all.filter(function (x) { return x.done_at; }).sort(function (a, b) {
      return a.done_at < b.done_at ? 1 : a.done_at > b.done_at ? -1 : 0;
    });
    shown = doneOpen ? items.concat(done) : items;
    sel = keepSelection(shown);
    if (!all.length) listEl.innerHTML = '<div id="empty">Nothing here. Add one below.</div>';
    var todayCount = items.filter(function (x) { return x.today; }).length;
    items.forEach(function (it, idx) {
      if (idx === todayCount && todayCount > 0) {
        var div = document.createElement("div"); div.className = "divider";
        listEl.appendChild(div);
      }
      listEl.appendChild(row(it));
    });
    if (done.length) {
      listEl.appendChild(doneHeader(done.length));
      if (doneOpen) done.forEach(function (it) { listEl.appendChild(row(it)); });
    }
  }

  function doneHeader(n) {
    var b = document.createElement("button");
    b.id = "donehdr"; b.className = doneOpen ? "" : "closed";
    var chev = document.createElement("span");
    chev.className = "chev"; chev.textContent = "▾";
    b.appendChild(chev);
    b.appendChild(document.createTextNode("Completed (" + n + ")"));
    b.onclick = function () {
      endEdit(false);
      doneOpen = !doneOpen; store.set("todo-done-open", doneOpen); render();
    };
    return b;
  }

  function row(it) {
    var el = document.createElement("div");
    el.className = "item" + (it === sel && keyNav ? " sel" : "") + (it.today ? " today" : "")
                 + (it.done_at ? " done" : "");
    var tick = document.createElement("button");
    var label = it.done_at ? "Not done" : "Done";
    tick.className = "tick"; tick.title = label; tick.setAttribute("aria-label", label);
    tick.onclick = function () { complete(it); };
    var span = document.createElement("span");
    span.className = "txt";
    span.textContent = it.text;
    var star = document.createElement("button");
    star.className = "star"; star.title = "Today";
    star.setAttribute("aria-label", "Today");
    star.setAttribute("aria-pressed", it.today ? "true" : "false");
    star.textContent = it.today ? "★" : "☆";
    star.onclick = function () { toggleToday(it); };
    // the whole row edits, except the buttons sitting in it
    el.onclick = function (ev) {
      if (ev.target.closest && ev.target.closest("button")) return;
      select(it);
      startEdit(it, el, span);
    };
    el.appendChild(tick); el.appendChild(span);
    if (current === ASSIGNEE_LIST) el.appendChild(bubbles(it));
    el.appendChild(star);
    rows[shown.indexOf(it)] = el;
    return el;
  }

  // One field holds the assignee, so picking a person drops the other one;
  // tapping the bubble that is already on clears it.
  function bubbles(it) {
    var wrap = document.createElement("span");
    wrap.className = "who";
    ["C", "D"].forEach(function (who) {
      var b = document.createElement("button");
      b.className = "bub" + (it.assignee === who ? " on" : "");
      b.textContent = who;
      b.title = it.assignee === who ? "Unassign " + who : "Assign " + who;
      b.setAttribute("aria-pressed", it.assignee === who ? "true" : "false");
      b.onclick = function () { assign(it, who); };
      wrap.appendChild(b);
    });
    return wrap;
  }

  function rowEl(it) { return rows[shown.indexOf(it)]; }

  // Selection is painted in place, so moving through the list never
  // rebuilds it (and never loses the scroll position).
  function select(it) {
    var old = listEl.querySelector(".item.sel");
    if (old) old.classList.remove("sel");
    sel = it;
    var el = it && keyNav ? rowEl(it) : null;
    if (el) { el.classList.add("sel"); el.scrollIntoView({ block: "nearest" }); }
  }

  // ---- actions, shared by mouse and keyboard

  // Ticking does not delete: done_at is stamped and the item drops into the
  // Completed section, where ticking again brings it back.
  function complete(it) {
    endEdit(false);
    var el = rowEl(it);
    if (el) el.classList.add("out");
    it.done_at = it.done_at ? null : new Date().toISOString();
    // the item still exists, it only moves section, so the selection stays
    // with it — pressing d again undoes the tick. If it lands in a collapsed
    // Completed section, render drops the selection instead.
    setTimeout(render, el ? 150 : 0);
    write(patch(it, { done_at: it.done_at }));
  }

  function assign(it, who) {
    endEdit(false);
    it.assignee = it.assignee === who ? null : who;
    render();
    write(patch(it, { assignee: it.assignee }));
  }

  function toggleToday(it) {
    endEdit(false);
    it.today = !it.today;
    render();
    write(patch(it, { today: it.today }));
  }

  function add(text) {
    endEdit(false);
    var it = { id: null, text: text, today: false, assignee: null, done_at: null };
    tabs[current] = (tabs[current] || []).concat([it]);
    render();
    it.saving = rest("todos", { method: "POST", body: { list: current, text: text }, prefer: "return=representation" })
      .then(function (rows) { it.saving = null; if (rows && rows[0]) it.id = rows[0].id; });
    write(it.saving);
  }

  // An item added a moment ago may not have its id yet: wait for the insert,
  // or failing that look it up by text.
  function byId(it) {
    if (it.id) return Promise.resolve(it.id);
    if (it.saving) return it.saving.then(function () { return byId(it); });
    var q = "todos?select=id&done_at=is.null&list=eq." + encodeURIComponent(current) + "&text=eq." + encodeURIComponent(it.text) + "&limit=1";
    return rest(q).then(function (rows) {
      if (!rows || !rows.length) throw new Error("not found: " + it.text);
      return (it.id = rows[0].id);
    });
  }

  function switchTab(n) {
    endEdit(false);
    if (n === current) return;
    current = n; sel = null; render();
  }

  // Edit in place: the text itself becomes editable. Enter, or tapping or
  // clicking anywhere else, saves; Escape puts the old text back. The row
  // is only touched in place — the list is repainted (re-sorted) once the
  // write settles, so whatever was tapped to leave the edit is still there.
  function startEdit(it, el, span) {
    if (editing && editing.it === it) return;
    if (editing) {
      // ending the other edit may repaint the list: pick the row up again
      endEdit(false);
      it = keepSelection(shown, it); el = it && rowEl(it);
      if (!el) return;
      span = el.querySelector(".txt");
    }
    var old = it.text, ended = false;
    el.classList.add("editing");
    span.contentEditable = "plaintext-only";
    if (span.contentEditable !== "plaintext-only") span.contentEditable = "true";
    span.focus();
    var range = document.createRange(), s = window.getSelection();
    range.selectNodeContents(span); range.collapse(false);
    s.removeAllRanges(); s.addRange(range);
    span.onkeydown = function (ev) {
      if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); end(false); }
      if (ev.key === "Escape") { ev.preventDefault(); end(true); }
      ev.stopPropagation();
    };
    span.onblur = function () { end(false); };
    function end(cancelled) {
      if (ended) return;
      ended = true;
      span.onkeydown = span.onblur = null;
      span.contentEditable = "false";
      if (document.activeElement === span) span.blur();
      el.classList.remove("editing");
      editing = null;
      var text = cancelled ? old : span.textContent.trim();
      if (!text) text = old;
      span.textContent = text;
      var changed = text !== old;
      if (changed) {
        it.text = text;
        write(patch(it, { text: text }));
      }
      if (it === sel && keyNav) el.classList.add("sel");
      if (dirty) {
        // whatever was fetched during the edit predates a changed text
        var fresh = changed || writes ? null : pendingFresh;
        dirty = false; pendingFresh = null;
        render(fresh);
      }
    }
    editing = { it: it, end: end };
  }

  function endEdit(cancelled) {
    if (editing) editing.end(cancelled);
  }

  function move(delta) {
    if (!shown.length) return;
    var idx = shown.indexOf(sel);
    idx = idx < 0 ? (delta > 0 ? 0 : shown.length - 1) : Math.max(0, Math.min(shown.length - 1, idx + delta));
    select(shown[idx]);
  }

  function moveTab(delta) {
    var names = Object.keys(tabs);
    if (names.length < 2) return;
    switchTab(names[(names.indexOf(current) + delta + names.length) % names.length]);
  }

  // ---- keyboard: the TUI's keys

  document.addEventListener("keydown", function (ev) {
    if (!session) return;
    if (ev.target === newEl) {
      if (ev.key === "Escape") { newEl.blur(); ev.preventDefault(); }
      return;
    }
    if (ev.target.isContentEditable) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (!helpEl.hidden && ev.key !== "?") helpEl.hidden = true;
    if (!keyNav) { keyNav = true; if (sel) select(sel); }
    switch (ev.key) {
      case "j": case "ArrowDown": move(1); break;
      case "k": case "ArrowUp": move(-1); break;
      case "l": case "Tab": moveTab(ev.shiftKey ? -1 : 1); break;
      case "h": moveTab(-1); break;
      case "a": newEl.focus(); break;
      case "e": case "Enter": if (sel) startEdit(sel, rowEl(sel), rowEl(sel).querySelector(".txt")); break;
      case "t": if (sel) toggleToday(sel); break;
      case "d": if (sel) complete(sel); break;
      case "C": case "D": if (sel && current === ASSIGNEE_LIST) assign(sel, ev.key); break;
      case "U": if (sel && current === ASSIGNEE_LIST && sel.assignee) assign(sel, sel.assignee); break;
      case "r": refresh(); break;
      case "o": window.open(TABLE_URL, "_blank"); break;
      case "?": helpEl.hidden = !helpEl.hidden; break;
      case "Escape": select(null); break;
      default:
        if (ev.key >= "1" && ev.key <= "9") {
          var n = Object.keys(tabs)[+ev.key - 1];
          if (n) switchTab(n);
        } else return;
    }
    ev.preventDefault();
  });

  // A pointer takes over from the keyboard: the selection bar goes away
  // until the keys are used again.
  listEl.addEventListener("pointerdown", function () {
    if (!keyNav) return;
    keyNav = false;
    var old = listEl.querySelector(".item.sel");
    if (old) old.classList.remove("sel");
  });

  document.getElementById("bar").onsubmit = function (ev) {
    ev.preventDefault();
    var text = newEl.value.trim();
    if (!text || !current) return;
    newEl.value = "";
    add(text);
  };
  // clicking + keeps typing in the box
  document.getElementById("plus").onmousedown = function (ev) { ev.preventDefault(); };

  login.onsubmit = function (ev) {
    ev.preventDefault();
    var msg = document.getElementById("loginmsg");
    msg.textContent = "";
    auth("password", { email: document.getElementById("email").value.trim(),
                       password: document.getElementById("password").value })
      .then(boot)
      .catch(function (err) { msg.textContent = String(err.message || err); });
  };

  function boot() {
    login.hidden = !!session;
    app.hidden = !session;
    if (!session) return;
    if (Object.keys(tabs).length) render();
    else listEl.innerHTML = '<div id="empty">Loading your lists</div>';
    refresh();
  }
  boot();

  // refresh when brought back to the foreground, and every 2 minutes while visible
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && session) refresh();
  });
  setInterval(function () { if (!document.hidden && session) refresh(); }, 120000);
</script>
</body>
</html>
